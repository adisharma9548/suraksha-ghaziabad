name: suraksha_ghaziabad
description: "Suraksha Ghaziabad - Safe City Women's Safety App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  # Hardware sensors & Media
  sensors_plus: ^5.0.1

  # Storage & Utilities
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  intl: ^0.20.2
  crypto: ^3.0.3
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/ghaziabad_seed_data.json
